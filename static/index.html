<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyMagpie WS Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>EasyMagpie WebSocket Streaming Demo</h1>
      <!-- <p class="hint">Frontend simulates dummy LLM text chunks and streams to backend.</p> -->

      <h3>Inference knobs</h3>
      <div class="grid2">
        <label for="cfgScale">CFG scale
          <input id="cfgScale" type="number" step="0.1" min="0" value="2.5" />
        </label>
        <label for="temperature">Temperature
          <input id="temperature" type="number" step="0.05" min="0.01" value="0.5" />
        </label>
        <label for="topk">Top-K
          <input id="topk" type="number" step="1" min="1" value="80" />
        </label>
        <label class="inlineRow">
          <input id="useCfg" type="checkbox" checked />
          Use CFG
        </label>
      </div>

      <h3>Context setup (auto-applies)</h3>
      <div class="grid2">
        <label for="contextSelect">Context text
          <select id="contextSelect"></select>
        </label>
        <label for="contextAudioSelect">Reference speaker audio
          <select id="contextAudioSelect"></select>
        </label>
        <label class="inlineRow">
          <input id="useContextAudio" type="checkbox" />
          Use reference speaker audio
        </label>
      </div>
      <label for="contextAudioFile">Upload reference speaker audio</label>
      <input id="contextAudioFile" type="file" accept=".wav,.mp3,.flac,.ogg,.m4a,.aac,audio/*" />
      <pre id="contextStatus">No uploaded reference audio.</pre>
      <audio id="contextAudioPreview" controls></audio>

      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="4">This is a streaming speech synthesis demo where text arrives gradually, tokens are consumed incrementally, and generated codec frames are decoded in the background for low-latency playback. Generare a sentence about this demo that Jensen Huang will say.</textarea>

      <label for="tokensPerSecond">LLM text send rate (tokens/sec to TTS)</label>
      <input id="tokensPerSecond" type="number" min="1" step="1" value="25" />

      <div class="controls">
        <button id="runBtn" disabled>Run Stream</button>
      </div>
      <div id="backendLoader" class="loader hidden" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span id="backendLoaderText">Applying backend context/speaker...</span>
      </div>

      <label for="streamViz">Audio stream monitor</label>
      <canvas id="streamViz" width="860" height="90"></canvas>
      <pre id="audioStats">chunks_rx=0 chunks_played=0 queued_sec=0.00 ttfa_ms=n/a</pre>

      <label for="partialText">Partial text (echo from backend)</label>
      <textarea id="partialText" rows="6" readonly></textarea>

      <label for="status">Status</label>
      <pre id="status">Disconnected</pre>

      <label for="outputClips">Finished clips</label>
      <div id="outputClips" class="clips"></div>
    </main>

    <script src="/static/app.js"></script>
  </body>
  </html>
